<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Đọc truyện</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20261026-chapter">
  <link rel="stylesheet" href="assets/css/reader.css?v=20261027-reader-studio-6">
</head>

<body class="reader-page reader-v2" data-reader-theme="dark">
  <div id="readingProgressBar" class="reading-progress-bar" aria-hidden="true"></div>

  <header id="readerTopChrome" class="reader-top-chrome reader-header">
    <div class="top-bar">
      <button class="reader-icon-btn reader-back-btn" type="button" onclick="goBack()" aria-label="Quay lại" title="Quay lại">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>

      <button class="home-logo-btn home-brand-btn" onclick="goHome()" aria-label="Trang chủ" title="Trang chủ">
        <img class="home-logo" src="assets/images/Logo.png" alt="">
        <span class="home-brand-text">Thư viện truyện</span>
      </button>

      <div class="reader-header-context">
        <strong id="readerBookTitle" class="reader-book-title" title="">Đang tải truyện...</strong>
        <span id="readerHeaderChapter">Đang tải chương...</span>
      </div>

      <div class="reader-header-actions">
        <button class="reader-icon-btn" type="button" onclick="toggleTocPanel()" aria-label="Mở mục lục" title="Mục lục">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        </button>

        <button class="reader-icon-btn" type="button" onclick="toggleSettings()" aria-label="Mở tùy chỉnh đọc" title="Tùy chỉnh đọc">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg>
        </button>

        <a id="bookDetailLink" class="reader-icon-btn reader-detail-link" href="#" title="Thông tin truyện" aria-label="Xem thông tin truyện">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
        </a>
      </div>
    </div>

    <div class="nav top-nav">
      <button class="top-nav-chapter-btn top-nav-prev" type="button" onclick="prevChapter()" aria-label="Chương trước">
        <span class="top-nav-chapter-icon" aria-hidden="true">&larr;</span>
        <span>Trước</span>
      </button>

      <div class="reader-top-select-field">
        <button id="partSelect" class="reader-top-menu-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="topPartMenu">
          <span id="topPartLabel">Phần 1</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>
        </button>
        <div id="topPartMenu" class="reader-toc-popover reader-top-popover" role="listbox" aria-label="Chọn phần" hidden></div>
      </div>

      <div class="reader-top-select-field">
        <button id="chapterSelect" class="reader-top-menu-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="topChapterMenu">
          <span id="topChapterLabel">Chọn chương</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>
        </button>
        <div id="topChapterMenu" class="reader-toc-popover reader-top-popover reader-top-chapter-popover" role="listbox" aria-label="Chọn chương" hidden></div>
      </div>

      <button class="top-nav-chapter-btn top-nav-next" type="button" onclick="nextChapter()" aria-label="Chương sau">
        <span>Sau</span>
        <span class="top-nav-chapter-icon" aria-hidden="true">&rarr;</span>
      </button>

    </div>
  </header>

<main id="readerMain" class="reader-stage">
  <article class="reader-paper">
    <header class="reader-chapter-hero">
      <div class="reader-chapter-kicker">
        <span class="reader-kicker-line" aria-hidden="true"></span>
        <span id="readerChapterNumber">Chương</span>
        <span class="reader-kicker-line" aria-hidden="true"></span>
      </div>

      <h1 id="readerChapterTitle">Đang tải chương...</h1>
      <div id="chapterMeta" class="chapter-meta" hidden></div>
    </header>

    <div id="content" class="content reader-content" aria-live="polite"></div>

    <nav class="reader-end-nav" aria-label="Điều hướng cuối chương">
      <button id="readerEndPrev" class="reader-end-btn" type="button" onclick="prevChapter()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        <span>
          <small>Chương trước</small>
          <strong id="readerEndPrevLabel">Quay lại</strong>
        </span>
      </button>

      <button class="reader-end-toc" type="button" onclick="toggleTocPanel()" aria-label="Mở mục lục">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
        <span>Mục lục</span>
      </button>

      <button id="readerEndNext" class="reader-end-btn reader-end-btn-next" type="button" onclick="nextChapter()">
        <span>
          <small>Chương sau</small>
          <strong id="readerEndNextLabel">Đọc tiếp</strong>
        </span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </nav>
  </article>
</main>

<nav class="reader-dock" aria-label="Điều khiển đọc nhanh">
  <button id="readerDockPrev" class="reader-dock-btn" type="button" onclick="prevChapter()" aria-label="Chương trước">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
  </button>

  <button class="reader-dock-center" type="button" onclick="toggleTocPanel()" aria-label="Mở mục lục">
    <span id="readerDockChapter">Chương --</span>
    <small id="readerDockProgress">-- / --</small>
  </button>

  <button id="readerDockNext" class="reader-dock-btn" type="button" onclick="nextChapter()" aria-label="Chương sau">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
  </button>

  <span class="reader-dock-divider" aria-hidden="true"></span>

  <button class="reader-dock-btn" type="button" onclick="toggleSettings()" aria-label="Tùy chỉnh đọc">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6"/></svg>
  </button>
</nav>

<div id="readerBackdrop" class="reader-backdrop" aria-hidden="true"></div>

<aside id="tocPanel" class="reader-side-panel reader-toc-panel" aria-hidden="true" aria-labelledby="tocPanelTitle">
  <header class="reader-panel-header">
    <div>
      <span class="reader-panel-eyebrow">Điều hướng</span>
      <h2 id="tocPanelTitle">Mục lục</h2>
    </div>
    <button class="reader-panel-close" type="button" onclick="closeReaderPanels()" aria-label="Đóng mục lục">&times;</button>
  </header>

  <div class="reader-panel-body">
    <label class="reader-search-box" for="tocSearchInput">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="tocSearchInput" type="search" placeholder="Tìm số hoặc tên chương..." autocomplete="off">
    </label>

    <div class="reader-toc-selects">
      <div id="tocPartField" class="reader-toc-field">
        <span class="reader-toc-field-label">Phần</span>
        <button id="tocPartTrigger" class="reader-toc-menu-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="tocPartMenu">
          <span id="tocPartLabel">Phần 1</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>
        </button>
        <div id="tocPartMenu" class="reader-toc-popover" role="listbox" aria-label="Chọn phần" hidden></div>
      </div>

      <div id="tocChapterField" class="reader-toc-field">
        <span class="reader-toc-field-label">Đi nhanh</span>
        <button id="tocChapterTrigger" class="reader-toc-menu-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="tocChapterMenu">
          <span id="tocChapterLabel">Chọn chương</span>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"/></svg>
        </button>
        <div id="tocChapterMenu" class="reader-toc-popover reader-toc-chapter-popover" role="listbox" aria-label="Chọn chương" hidden></div>
      </div>
    </div>

    <div class="reader-toc-summary">
      <strong id="tocResultTitle">Danh sách chương</strong>
      <span id="tocResultCount"></span>
    </div>

    <div id="readerTocList" class="reader-toc-list" role="list"></div>
    <p id="readerTocEmpty" class="reader-toc-empty" hidden>Không tìm thấy chương phù hợp.</p>
  </div>
</aside>

<aside id="settings" class="reader-side-panel reader-settings-panel" aria-hidden="true" aria-labelledby="settingsPanelTitle">
  <header class="reader-panel-header">
    <div>
      <span class="reader-panel-eyebrow">Không gian đọc</span>
      <h2 id="settingsPanelTitle">Tùy chỉnh</h2>
    </div>
    <button class="reader-panel-close" type="button" onclick="closeReaderPanels()" aria-label="Đóng tùy chỉnh">&times;</button>
  </header>

  <div class="reader-panel-body reader-settings-body">
  <div class="settings-row settings-row-top">
    <div class="settings-control settings-size-stepper" aria-label="Cỡ chữ">
      <button class="settings-step-btn" type="button" onclick="adjustFontSize(-1)" aria-label="Giảm cỡ chữ">A-</button>
      <span id="fontSizeLabel" class="settings-size-value">20</span>
      <button class="settings-step-btn" type="button" onclick="adjustFontSize(1)" aria-label="Tăng cỡ chữ">A+</button>
    </div>

    <div class="settings-theme-swatches" role="group" aria-label="Giao diện màu">
      <button class="theme-swatch theme-swatch-dark" type="button" data-theme="0" onclick="applyTheme(0)" aria-label="Dark"></button>
      <button class="theme-swatch theme-swatch-light" type="button" data-theme="1" onclick="applyTheme(1)" aria-label="Light"></button>
      <button class="theme-swatch theme-swatch-sepia" type="button" data-theme="2" onclick="applyTheme(2)" aria-label="Sepia"></button>
    </div>

    <div class="settings-control settings-segment font-segment" role="group" aria-label="Font chữ">
      <button type="button" data-font="Merriweather" onclick="setFont('Merriweather')">Serif</button>
      <button type="button" data-font="Noto Sans" onclick="setFont('Noto Sans')">Sans</button>
      <button type="button" data-font="Verdana" onclick="setFont('Verdana')">Verdana</button>
    </div>
  </div>

  <div class="settings-divider" aria-hidden="true"></div>

  <div class="settings-row settings-row-bottom">
    <div class="settings-inline-group">
      <span class="settings-inline-label" aria-hidden="true">&#8597;</span>
      <div class="settings-control settings-segment" role="group" aria-label="Khoảng cách dòng">
        <button type="button" data-lineheight="1.6" onclick="setLineHeight(1.6)">1.6</button>
        <button type="button" data-lineheight="1.8" onclick="setLineHeight(1.8)">1.8</button>
        <button type="button" data-lineheight="2" onclick="setLineHeight(2)">2</button>
      </div>
    </div>

    <div class="settings-inline-group">
      <span class="settings-inline-label settings-inline-label-text">AV</span>
      <div class="settings-control settings-segment" role="group" aria-label="Khoảng cách chữ">
        <button type="button" data-letterspacing="normal" onclick="setLetterSpacing('normal')">0</button>
        <button type="button" data-letterspacing="0.06em" onclick="setLetterSpacing('0.06em')">1</button>
        <button type="button" data-letterspacing="0.12em" onclick="setLetterSpacing('0.12em')">2</button>
      </div>
    </div>

    <div class="settings-control settings-segment align-segment" role="group" aria-label="Canh chữ">
      <button type="button" data-align="left" onclick="setTextAlign('left')" aria-label="Canh trái">
        <span class="text-align-icon text-align-left" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
      <button type="button" data-align="justify" onclick="setTextAlign('justify')" aria-label="Canh đều">
        <span class="text-align-icon text-align-justify" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
    </div>

    <div class="settings-switch-group">
      <span class="settings-switch-label">Nhớ vị trí</span>
      <button id="rememberProgressToggle" class="settings-switch" type="button" role="switch" aria-checked="true" onclick="toggleRememberProgress()">
        <span class="settings-switch-thumb" aria-hidden="true"></span>
      </button>
    </div>
  </div>

  <div class="settings-divider" aria-hidden="true"></div>

  <section class="reader-width-setting">
    <span class="reader-setting-label">Độ rộng trang đọc</span>
    <div class="reader-width-grid" role="group" aria-label="Độ rộng trang đọc">
      <button type="button" data-reader-width="narrow" onclick="setReaderWidth('narrow')">
        <span class="width-icon width-narrow" aria-hidden="true"></span><strong>Hẹp</strong>
      </button>
      <button type="button" data-reader-width="normal" onclick="setReaderWidth('normal')">
        <span class="width-icon width-normal" aria-hidden="true"></span><strong>Vừa</strong>
      </button>
      <button type="button" data-reader-width="wide" onclick="setReaderWidth('wide')">
        <span class="width-icon width-wide" aria-hidden="true"></span><strong>Rộng</strong>
      </button>
    </div>
  </section>
  </div>
</aside>

  <script src="assets/js/data-source.js?v=20261021-r2"></script>
  <script src="assets/js/script.js?v=20261027-reader-studio-4"></script>
<button id="scrollTopBtn" class="scroll-top" type="button" title="Lên đầu trang">&#11014;</button>
</body>
</html>
